<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <meta name="theme-color" content="#f7f7f3" />
  <meta name="description" content="TYKORA — свободный персональный тренажёр печати. Локальный прогресс и обучение без аккаунтов." />
  <meta name="tykora-version" content="0.9.0-beta" />
  <title>TYKORA · The art and science of typing</title>
  <!-- Local critical paint; no external font/CDN requests. Requires CSP hash if a strict style-src is introduced. -->
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;background:#f7f7f3;color:#19231f}
    .boot{box-sizing:border-box;max-width:1080px;margin:0 auto;padding:clamp(36px,8vw,100px) 24px;min-height:60vh}
    .boot-brand{font-size:13px;letter-spacing:.17em;font-weight:800;color:#185f50}
    .boot h1{font-size:clamp(32px,5vw,54px);line-height:1.12;max-width:640px;margin:40px 0 18px}
    .boot p{font-size:16px;line-height:1.7;color:#52625b}
    .boot-status{display:inline-block;margin-top:28px;font-size:12px;color:#52625b}
    @media(prefers-reduced-motion:reduce){.boot *{animation:none!important}}
  </style>
</head>
<body>
  <div id="root">
    <main class="boot" aria-label="TYKORA">
      <div class="boot-brand">TYKORA</div>
      <h1>Тренируйтесь в своём темпе.</h1>
      <p>Бесплатный тренажёр печати. Прогресс сохраняется локально.</p>
      <span role="status" class="boot-status">Загрузка интерфейса…</span>
    </main>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

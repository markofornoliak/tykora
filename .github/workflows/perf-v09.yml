name: Beta 0.9 production performance lab
on:
  push:
    branches: [feature/v0.9.0]
    paths:
      - '.github/workflows/perf-v09.yml'
      - 'src/app/**'
      - 'src/features/**'
      - 'src/shared/**'
      - 'src/styles/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Build actual production output
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/tykora-v09.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tykora-v09.log
          exit 1
      - name: Lighthouse fixed laboratory conditions (two mobile samples, desktop)
        run: |
          mkdir -p perf-v0.9.0
          for run in 1 2; do
            npm exec --yes --package=lighthouse@12.8.2 -- lighthouse http://127.0.0.1:4174/ --chrome-flags="--headless --no-sandbox" --output=json --output-path=perf-v0.9.0/mobile-${run}.json --quiet
          done
          npm exec --yes --package=lighthouse@12.8.2 -- lighthouse http://127.0.0.1:4174/ --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=perf-v0.9.0/desktop.json --quiet
          node - <<'NODE'
          const fs=require('node:fs');
          const measurements=[];
          for(const id of ['mobile-1','mobile-2','desktop']){
            const j=JSON.parse(fs.readFileSync('perf-v0.9.0/'+id+'.json','utf8'));
            const values=Object.fromEntries(Object.entries(j.categories).map(([k,v])=>[k,Math.round((v.score??0)*100)]));
            const row={id,version:j.lighthouseVersion,date:j.fetchTime,
              url:j.finalDisplayedUrl,categories:values,LCPms:j.audits['largest-contentful-paint']?.numericValue,
              CLS:j.audits['cumulative-layout-shift']?.numericValue,
              benchmarkIndex:j.environment?.benchmarkIndex,
              screen:j.configSettings?.screenEmulation,
              throttling:j.configSettings?.throttling};
            measurements.push(row);
            console.log('V09_PERF '+JSON.stringify(row));
          }
          fs.writeFileSync('perf-v0.9.0/summary.json',JSON.stringify(measurements,null,2));
          NODE
      - name: Store raw performance traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tykora-v09-production-lighthouse
          path: perf-v0.9.0/
          if-no-files-found: warn

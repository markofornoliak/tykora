name: Release to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tykora-pages
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Domain + backup checks
        run: npm run check:domain && npm run check:backup
      - name: Theme and worker checks
        run: npm run check:quality && npm run check:workers
      - name: Typecheck, lint, i18n, property and unit tests
        run: npm run check && npm run lint && npm run check:i18n && npm run test:property && npm run test
      - name: Build for local production browser regression
        run: npm run build
      - name: Verify locally built output
        run: npm run check:dist
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: All-browser production E2E and offline checks
        run: npm run test:e2e && npm run test:e2e:production
      - name: Rebuild for GitHub Pages subpath
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Verify GitHub Pages artifact
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run check:dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Live HTML smoke test
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --max-time 15 "$url" | grep -Fq '0.9.0-beta'; then
              echo "Live Beta v0.9.0 marker verified: $url"
              exit 0
            fi
            sleep 10
          done
          echo "Pages version-specific smoke failed at $url"
          exit 1

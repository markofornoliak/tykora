name: Input-to-paint baseline (4x CPU)
on:
  push:
    branches: [feature/v0.9.0]
    paths:
      - 'scripts/benchmark-input.mjs'
      - '.github/workflows/input-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: VITE_BASE_PATH=/ npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/tykora-input-preview.log 2>&1 &)
          for i in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:4174/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/tykora-input-preview.log
          exit 1
      - name: Measure real keyboard input under CPU 4x
        run: node scripts/benchmark-input.mjs
      - name: Upload raw JSON measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tykora-input-benchmark
          path: performance-artifacts/input-benchmark.json
          if-no-files-found: warn

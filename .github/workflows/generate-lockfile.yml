name: Generate npm lockfile (temporary v0.9 branch gate)
on:
  push:
    branches: [feature/v0.9.0]
    paths: ['.github/workflows/generate-lockfile.yml']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate npm lock using the real registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible install
        run: npm ci --no-audit --no-fund
      - name: Run existing regression gates
        run: npm run check:domain && npm run check:backup && npm run check:quality && npm run check:workers && npm run check && npm run test && npm run build
      - name: Commit generated lockfile to feature branch only
        run: |
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add npm-generated package-lock [verified ci]" 
          git push origin HEAD:feature/v0.9.0

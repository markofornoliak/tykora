name: Iteration 6 - full 124-lesson diagnostic
on:
  push:
    branches: [feature/iter6-summit]
    paths:
      - 'scripts/iter6-content-audit.cjs'
      - '.github/workflows/iter6-content-audit.yml'
      - 'src/domain/lessons/**'
      - 'src/domain/content/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-full-corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:domain && npm run check && npm run lint && npm run test && npm run build && npm run check:dist
      - name: Inspect every lesson in both supported languages without pretending failures pass
        run: node scripts/iter6-content-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tykora-iter6-full-corpus-audit
          path: performance-artifacts/iter6-content/*.json
          if-no-files-found: warn

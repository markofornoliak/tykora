name: Iteration 5 - isolate LCP regression within ab8e9d
on:
  push:
    branches: [feature/iter5-quality-design]
    paths: [.github/workflows/iter5-lcp-isolate.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [ab8e,old-layout,old-store,old-home,old-index,old-layout-store,old-layout-home,old-all]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab8e9d94695f3cbe2bced26fcf9c3649e7b3d901
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: feature/iter5-quality-design
          path: .iter5-harness
          sparse-checkout: scripts/iter5-lcp-bisect.mjs
          persist-credentials: false
      - name: Apply one controlled reversion
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          baseline=fece01874c40834edbb8774b05c612ab2d1e3344
          case "$VARIANT" in
            ab8e) ;;
            old-layout) git show "$baseline:src/shared/ui/Layout.tsx" > src/shared/ui/Layout.tsx ;;
            old-store) git show "$baseline:src/app/store/uiStore.ts" > src/app/store/uiStore.ts ;;
            old-home) git show "$baseline:src/features/home/Home.tsx" > src/features/home/Home.tsx ;;
            old-index) git show "$baseline:index.html" > index.html ;;
            old-layout-store)
              git show "$baseline:src/shared/ui/Layout.tsx" > src/shared/ui/Layout.tsx
              git show "$baseline:src/app/store/uiStore.ts" > src/app/store/uiStore.ts ;;
            old-layout-home)
              git show "$baseline:src/shared/ui/Layout.tsx" > src/shared/ui/Layout.tsx
              git show "$baseline:src/features/home/Home.tsx" > src/features/home/Home.tsx ;;
            old-all)
              for file in src/shared/ui/Layout.tsx src/app/store/uiStore.ts src/features/home/Home.tsx index.html; do git show "$baseline:$file" > "$file"; done ;;
            *) exit 1 ;;
          esac
          git diff --stat
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: VITE_BASE_PATH=/ npm run build
      - name: Start local production preview
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/iter5-isolate.log 2>&1 &)
          for i in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:4174/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/iter5-isolate.log; exit 1
      - name: Matched Lighthouse mobile x5
        run: |
          mkdir -p performance-artifacts/lcp-bisect
          for i in 1 2 3 4 5; do
            npm exec --yes --package=lighthouse@12.8.2 -- lighthouse http://127.0.0.1:4174/ --chrome-flags="--headless --no-sandbox" --output=json --output-path="performance-artifacts/lcp-bisect/run-$i.json" --quiet
          done
      - name: Summarize each isolated variant
        env:
          BISECT_REF: ${{ matrix.variant }}
        run: node .iter5-harness/scripts/iter5-lcp-bisect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter5-lcp-isolate-${{ matrix.variant }}
          path: performance-artifacts/lcp-bisect/*.json
          if-no-files-found: warn

name: Iteration 6 - deep-link keyboard focus stress x5
on:
  push:
    branches: [feature/iter6-summit]
    paths:
      - '.github/workflows/iter6-focus-stress.yml'
      - 'e2e/a11y-i18n.spec.ts'
      - 'e2e/iter6-deeplink-focus.spec.ts'
      - 'src/main.tsx'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-focus-repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:dist
      - name: Install Chromium for additional focused stress run
        run: npx playwright install chromium
      - name: Original skip-link and delayed-entry deep-link regression x5
        run: npx playwright test e2e/a11y-i18n.spec.ts e2e/iter6-deeplink-focus.spec.ts --project=chromium --repeat-each=5 --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter6-focus-stress-x5-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

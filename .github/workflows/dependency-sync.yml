name: One-time locked quality dependency sync
on:
  push:
    branches: [feature/v0.9.0]
    paths: ['.github/workflows/dependency-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.9.0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Install pinned quality tools and update the npm lock
        run: npm install --save-dev --save-exact eslint@9.39.1 @eslint/js@9.39.1 typescript-eslint@8.46.4 fast-check@4.4.0 @axe-core/playwright@4.10.2 --no-audit --no-fund
      - name: Commit reproducible lockfile and manifest to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: lock ESLint, TypeScript ESLint and fast-check for iteration 3"
          git pull --rebase origin feature/v0.9.0
          git push origin HEAD:feature/v0.9.0

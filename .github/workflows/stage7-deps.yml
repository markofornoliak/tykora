name: Stage 7 Build Dependencies
on:
  push:
    branches: [work/stage7-performance]
permissions:
  contents: read
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies
        run: npm install --no-audit --no-fund
      - name: Pack offline dependencies
        run: tar -czf stage7-deps.tar.gz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage7-deps
          path: stage7-deps.tar.gz
          retention-days: 1

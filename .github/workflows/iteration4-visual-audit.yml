name: Iteration 4 visual evidence
on:
  push:
    branches: [feature/iter4-design-content]
    paths:
      - '.github/workflows/iteration4-visual-audit.yml'
      - 'scripts/audit-screenshots.mjs'
      - 'scripts/audit-css.mjs'
      - 'src/styles/app.css'
      - 'src/features/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: VITE_BASE_PATH=/ npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start local-only production preview
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/tykora-iter4-preview.log 2>&1 &)
          for i in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:4174/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tykora-iter4-preview.log
          exit 1
      - name: Static CSS token inventory
        run: node scripts/audit-css.mjs
      - name: Route and palette screenshot audit
        run: node scripts/audit-screenshots.mjs
      - name: Measure candidate mobile Lighthouse — Home and Practice
        run: |
          mkdir -p docs/iteration4/audit/lighthouse
          for route in home practice; do
            if [ "$route" = "home" ]; then target='http://127.0.0.1:4174/'; else target='http://127.0.0.1:4174/#/practice'; fi
            npm exec --yes --package=lighthouse@12.8.2 -- lighthouse "$target" --chrome-flags="--headless --no-sandbox" --output=json --output-path="docs/iteration4/audit/lighthouse/$route-mobile.json" --quiet
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const route of ['home','practice']){
            const d=JSON.parse(fs.readFileSync('docs/iteration4/audit/lighthouse/'+route+'-mobile.json','utf8'));
            const scores=Object.fromEntries(Object.entries(d.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
            console.log('ITER4_LIGHTHOUSE '+JSON.stringify({route,version:d.lighthouseVersion,scores,
              LCPms:d.audits['largest-contentful-paint']?.numericValue,CLS:d.audits['cumulative-layout-shift']?.numericValue,
              throttling:d.configSettings?.throttling,formFactor:d.configSettings?.formFactor}));
          }
          NODE
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iter4-visual-evidence
          path: |
            docs/iteration4/audit/screens/
            docs/iteration4/audit/lighthouse/
            docs/iteration4/audit/css-metrics.json
          if-no-files-found: warn
          retention-days: 30

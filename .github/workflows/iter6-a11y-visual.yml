name: Iteration 6 - dedicated full palette axe and visual evidence
on:
  push:
    branches: [feature/iter6-summit]
    paths:
      - '.github/workflows/iter6-a11y-visual.yml'
      - 'e2e/iter5-a11y-matrix.spec.ts'
      - 'e2e/iter5-visual.spec.ts'
      - 'src/shared/theme/**'
      - 'src/styles/**'
      - 'src/shared/ui/**'
      - 'src/features/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-axe-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run lint && npm run test && npm run build && npm run check:dist
      - run: npx playwright install --with-deps chromium
      - name: Full palette 9 routes x 24 themes x 3 widths
        env:
          TYKORA_A11Y_FULL_MATRIX: '1'
        run: npx playwright test e2e/iter5-a11y-matrix.spec.ts --project=chromium --workers=2
  visual-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run lint && npm run test && npm run build && npm run check:dist
      - run: npx playwright install --with-deps chromium
      - name: Capture 36 baseline images without claiming golden pixel PASS
        env:
          TYKORA_VISUAL_CAPTURE: '1'
        run: npx playwright test e2e/iter5-visual.spec.ts --project=chromium --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter6-36-visual-review-images
          path: performance-artifacts/iter5-visual/*.png
          if-no-files-found: warn

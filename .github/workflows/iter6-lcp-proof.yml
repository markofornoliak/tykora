name: Iteration 6 - extract median LCP stages and filmstrip
on:
  push:
    branches: [feature/iter6-summit]
    paths:
      - '.github/workflows/iter6-lcp-proof.yml'
      - 'scripts/iter6-lcp-evidence.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          repository: markofornoliak/tykora
          run-id: 42125543917
          name: tykora-iter6-phase0-3way-lh12x
          path: performance-artifacts/iter6-lcp/raw
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract both middle trials and representative filmstrip
        run: node scripts/iter6-lcp-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iter6-lcp-median-filmstrip-raw
          path: performance-artifacts/iter6-lcp/evidence/
          if-no-files-found: warn
